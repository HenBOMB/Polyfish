<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyAI Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <div id="app-container">
        <!-- Sidebar: Stats & Tech -->
        <aside id="left-sidebar" class="glass">
            <header>
                <h1 class="glow-text">PolyAI</h1>
                <div class="turn-badge">Turn <span id="turn-val">1</span>/30</div>
            </header>

            <section id="tribe-info">
                <div class="stat-card">
                    <label>Current Tribe</label>
                    <div id="tribe-name" class="stat-value">Luxidoor</div>
                </div>
                <div class="stats-row">
                    <div class="stat-card mini">
                        <label>Stars</label>
                        <div id="stars-val" class="stat-value gold">10</div>
                    </div>
                    <div class="stat-card mini">
                        <label>Score</label>
                        <div id="score-val" class="stat-value">69</div>
                    </div>
                </div>
                <div class="stat-card">
                    <label>Income</label>
                    <div id="income-val" class="stat-value green">+2</div>
                </div>
            </section>

            <section id="tech-tree-container">
                <h3>Technology Tree</h3>
                <div id="tech-list" class="tech-grid">
                    <!-- Tech badges will be injected here -->
                </div>
            </section>
        </aside>

        <!-- Main Area: Map -->
        <main id="main-view">
            <div id="map-viewport">
                <canvas id="space-bg"></canvas>
                <div id="map"></div>
            </div>

            <!-- Floating Hover Info -->
            <div id="hovertile" class="glass hidden"></div>

            <!-- Bottom Controls -->
            <footer id="control-bar" class="glass">
                <div class="control-group">
                    <button id="btn-reset" class="btn secondary" title="Reset Game">
                        <span class="icon">↺</span> Reset
                    </button>
                    <button id="btn-fow" class="btn secondary" title="Toggle Fog of War">
                        <span class="icon">👁</span> FOW
                    </button>
                    <button id="btn-train" class="btn secondary" title="Start Training in Background">
                        <span class="icon">🎓</span> Train
                    </button>
                    <button id="btn-predictions" class="btn secondary" title="Toggle AI Predictions Overlay">
                        <span class="icon">🔮</span> AI
                    </button>
                </div>

                <div class="control-group central">
                    <button id="btn-rng" class="btn highlight" title="Perform Random Move">
                        <!-- Play random moves -->
                        <span class="icon">🎲</span> PRM
                    </button>

                    <div class="mcts-control">
                        <button id="btn-step" class="btn primary" title="Run MCTS Search">
                            <span class="icon">🤖</span> MCTS Step
                        </button>
                        <div class="slider-wrapper">
                            <label>Depth (Iterations)</label>
                            <input type="range" id="mcts-depth" min="10" max="500" value="100" step="10">
                            <span id="mcts-depth-val">100</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <div id="last-move-label">Last Move: <span id="last-move-val" class="move-name">None</span></div>
                </div>
            </footer>
        </main>

        <!-- Right Sidebar: Available Moves & training -->
        <aside id="right-sidebar" class="glass">
            <div id="training-ui" class="hidden">
                <h3>Training Progress</h3>
                <div class="stat-card">
                    <div id="training-indicator" class="stat-value small">Running...</div>
                    <pre id="training-log" class="log-stream"></pre>
                </div>
            </div>

            <h3>Legal Moves</h3>
            <div id="moves-list-container">
                <ul id="moves-list">
                    <!-- Moves will be injected here -->
                </ul>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="js/types.js"></script>
    <script src="js/space-bg.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
