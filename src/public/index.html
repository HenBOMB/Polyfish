<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyfish Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/components/map.css?v=5">
    <link rel="stylesheet" href="css/components/ui.css?v=4">
    <link rel="stylesheet" href="css/components/techtree.css?v=2">
    <link rel="stylesheet" href="css/replay.css?v=2">
</head>

<body>
    <div id="app-container">
        <!-- Top RTS Bar: Full width, solid -->
        <header id="top-rts-bar">
            <div class="rts-group left">
                <div class="game-logo">Polyfish</div>
            </div>

            <div class="rts-group center">
                <div class="resource-item" title="Current Tribe">
                    <span id="tribe-name" class="value">Imperius</span>
                </div>
                <div class="resource-item" title="Stars and Income">
                    <span class="icon gold">⭐</span>
                    <span id="stars-val" class="value">0</span>
                    <span id="income-val" class="sub-value green">(+0)</span>
                </div>
                <div class="resource-item" title="Total Score">
                    <span class="icon">🏆</span>
                    <span id="score-val" class="value">0</span>
                </div>
                <div class="resource-item">
                    <span class="label">Turn:</span>
                    <span id="turn-val" class="value">1</span><span class="total">/</span><span id="turn-total"
                        class="total">30</span>
                </div>
            </div>

            <div class="rts-group right system-controls">
                <button id="btn-fit-board" class="rts-sys-btn">Fit Board</button>
                <button id="btn-fow" class="rts-sys-btn" aria-pressed="true">Fog of War</button>
                <div id="ai-turn-indicator" class="turn-badge hidden" aria-live="polite"></div>
            </div>
        </header>

        <!-- Main Viewport -->
        <main id="main-view">
            <div id="map-viewport">
                <canvas id="space-bg"></canvas>
                <div id="map"></div>
                <div id="tile-action-popup" class="hidden"></div>
            </div>

            <!-- Floating Hover Info: More subtle -->
            <div id="hovertile" class="rts-tooltip hidden"></div>

            <footer id="command-console" aria-label="Match controls">
                <div id="selection-container">
                    <div id="selection-rich-content">
                        <span id="selection-info">Select a unit or tile</span>
                    </div>
                </div>

                <div class="command-actions">
                    <button type="button" id="btn-reset" class="rts-btn">New Match</button>
                    <details id="game-files">
                        <summary class="rts-btn">Game Files</summary>
                        <div class="game-files-menu">
                            <button type="button" id="btn-save-state" class="rts-btn">Save Game</button>
                            <button type="button" id="btn-load-state" class="rts-btn">Load Saved Game</button>
                            <button type="button" id="btn-replay" class="rts-btn" onclick="openReplayMenu()">Open Replay File</button>
                            <button type="button" id="btn-preview" class="rts-btn" onclick="previewInitialState()">Load Starting Position</button>
                        </div>
                    </details>
                    <input id="replay-file-input" type="file" accept=".json,application/json" hidden
                        onchange="openReplayFile(this)">
                    <div class="turn-actions">
                        <button type="button" id="btn-tech" class="rts-btn">Tech Tree</button>
                        <button type="button" id="btn-end-turn" class="rts-btn primary" disabled>End Turn</button>
                    </div>
                </div>
            </footer>
        </main>
    </div>
    <div id="toast-container"></div>

    <!-- SVG Filter for Outline Shader -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
        <defs>
            <!-- Crisp White Outline -->
            <filter id="outline-white" x="-20%" y="-20%" width="140%" height="140%">
                <feMorphology in="SourceAlpha" result="dilated" operator="dilate" radius="2" />
                <feFlood flood-color="white" result="white" />
                <feComposite in="white" in2="dilated" operator="in" result="outline" />
                <feMerge>
                    <feMergeNode in="outline" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Crisp Gold Outline -->
            <filter id="outline-gold" x="-20%" y="-20%" width="140%" height="140%">
                <feMorphology in="SourceAlpha" result="dilated" operator="dilate" radius="2" />
                <feFlood flood-color="#fbbf24" result="gold" />
                <feComposite in="gold" in2="dilated" operator="in" result="outline" />
                <feMerge>
                    <feMergeNode in="outline" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Selected Blueprint (Blue) Outline -->
            <filter id="outline-blue" x="-20%" y="-20%" width="140%" height="140%">
                <feMorphology in="SourceAlpha" result="dilated" operator="dilate" radius="2" />
                <feFlood flood-color="#3b82f6" result="blue" />
                <feComposite in="blue" in2="dilated" operator="in" result="outline" />
                <feMerge>
                    <feMergeNode in="outline" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
    </svg>

    <dialog id="research-setup" aria-labelledby="research-setup-title">
        <form>
            <h2 id="research-setup-title">New Match</h2>
            <p>1v1 Might · Drylands · Fog of War</p>
            <label>Map size
                <select name="mapSize">
                    <option value="121">121 tiles (11×11)</option>
                    <option value="196">196 tiles (14×14)</option>
                    <option value="256">256 tiles (16×16)</option>
                </select>
            </label>
            <label>Your tribe
                <select name="tribe1">
                    <option value="random" selected>Random</option>
                    <option>Imperius</option><option>Bardur</option><option>Xin-Xi</option><option>Oumaji</option>
                </select>
            </label>
            <label>Opponent tribe
                <select name="tribe2">
                    <option value="random" selected>Random</option>
                    <option>Imperius</option><option>Bardur</option><option>Xin-Xi</option><option>Oumaji</option>
                </select>
            </label>
            <label>Opponent
                <select name="opponentPreset">
                    <option value="human">Local player</option>
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="expert">Expert</option>
                    <option value="learned" disabled>Learned (11×11)</option>
                </select>
            </label>
            <label>Seed <input name="seed" placeholder="Random" pattern="-?[0-9]+"></label>
            <p id="research-setup-error" role="alert" hidden></p>
            <div class="research-setup-actions">
                <button type="button" id="btn-cancel-setup" class="rts-btn">Cancel</button>
                <button type="submit" class="rts-btn primary">Start Match</button>
            </div>
        </form>
    </dialog>

    <!-- Scripts -->
    <script src="js/types.js?v=4"></script>
    <script src="js/functions.js?v=4"></script>
    <script src="js/actions.js?v=6"></script>
    <script src="js/map.js?v=5"></script>
    <script src="js/space-bg.js?v=2"></script>
    <script src="js/replay.js?v=6"></script>
    <script src="js/research-match.js?v=6"></script>
    <script src="js/main.js?v=8"></script>

    <!-- Replay UI Overlay -->
    <div id="replay-controls" class="hidden">
        <div class="replay-header">
            <span><span class="icon">📼</span> <span id="replay-title">Replay</span></span>
            <button class="replay-close" onclick="exitReplayMode()">✕</button>
        </div>
        <div class="replay-body">
            <div class="replay-turn-info">
                Step: <span id="replay-step-val">0 / 0</span>
                <span class="replay-separator">·</span>
                <span id="replay-turn-player">Turn 0 · Player 1</span>
            </div>
            <div class="replay-nav">
                <button class="rts-btn mini" onclick="firstReplayStep()">⏮</button>
                <button class="rts-btn mini" onclick="prevReplayStep()">◀ Prev</button>
                <button id="replay-play" class="rts-btn mini purple" onclick="toggleReplayPlay()">Play</button>
                <button class="rts-btn mini" onclick="nextReplayStep()">Next ▶</button>
                <button class="rts-btn mini" onclick="lastReplayStep()">⏭</button>
            </div>
            <div class="replay-analysis">
                <div class="analysis-box user">
                    <div class="label">Next command</div>
                    <div id="replay-command" class="value">—</div>
                </div>
                <div class="analysis-box ai">
                    <div class="label">Game result</div>
                    <div id="replay-result" class="value">Result not recorded</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Initial State Selection Modal -->
    <div id="initial-state-modal" class="reward-overlay hidden">
        <div class="reward-modal" style="width: 400px; min-height: 200px;">
            <h2>Load Starting Position</h2>
            <div style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
                <select id="initial-state-select"
                    style="padding: 10px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--rts-border); border-radius: 4px;">
                    <option value="">Loading...</option>
                </select>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button class="rts-btn" onclick="closeInitialStateModal()">Cancel</button>
                    <button class="rts-btn primary" onclick="confirmInitialStateSelection()">Load</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
