<!-- Score Bar -->
<div class="fixed top-0 left-0">
    <div class="text-3xl font-bold underline z-1 m-1 border-black border-4 rounded-lg">
        <div id="score-meter" class="w-6 h-96 bg-gray-600 flex flex-col overflow-hidden">
            <div id="my-score" class="bg-white" style="height: var(--my-score-height, 50%);"></div>
            <div id="enemy-score" class="bg-blue-800" style="height: var(--enemy-score-height, 50%);"></div>
        </div>
    </div>
</div>

<div class="fixed bottom-0 w-full bg-white h-30 z-1 flex justify-center items-center">
    <div class="h-full w-1/3 bg-black p-4 flex justify-evenly items-center">
        <!-- Back -->
        <button onclick="controlsBck()" class="bg-gray-300 hover:bg-gray-400 duration-300 h-full aspect-square">
            
        </button>
        <!-- Autostep -->
        <button onclick="controlsAutostep()" class="bg-gray-300 hover:bg-gray-400 duration-300 h-full aspect-square">
            
        </button>
        <!-- Forward -->
        <button onclick="controlsFwd()" class="bg-gray-300 hover:bg-gray-400 duration-300 h-full aspect-square">
            
        </button>
    </div>
</div>
