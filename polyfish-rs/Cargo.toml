[package]
name = "polyfish"
version = "0.1.0"
edition = "2024"
description = "Polytopia game simulator in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
rand = "0.8"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
strum = "0.27.2"
strum_macros = "0.27.2"
candle-core = "0.8.2"
candle-nn = "0.8.2"
anyhow = "1.0.100"
rayon = "1.10"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "fat"
codegen-units = 1
