[package]
name = "polyfish"
version = "0.1.0"
edition = "2024"
description = "Polytopia game simulator in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
rand = "0.8"
rand_distr = "0.4"
axum = "0.7"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
strum = "0.27.2"
strum_macros = "0.27.2"
anyhow = "1.0.100"
rayon = "1.11.0"
indexmap = { version = "2.0", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
lazy_static = "1.5.0"

[features]
default = []

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "fat"
codegen-units = 1

[[test]]
name = "stats"
harness = false

[[test]]
name = "debug_stars"
harness = false

[[test]]
name = "debug_mcts_undo"
harness = false

[[test]]
name = "debug_water_sim"
harness = false

[[test]]
name = "inspect_seed"
harness = false

[[test]]
name = "test_branching"
harness = false

[[test]]
name = "verify_luxidor"
harness = false

