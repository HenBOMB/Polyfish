[package]
name = "polyfish"
version = "0.1.0"
edition = "2024"
description = "Polytopia game simulator in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
rand = "0.8"
rand_distr = "0.4"
axum = "0.7"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
strum = "0.27.2"
strum_macros = "0.27.2"
candle-core = "0.9.2"
candle-nn = "0.9.2"
anyhow = "1.0.100"
rayon = "1.11.0"
indexmap = { version = "2.0", features = ["serde"] }
clap = { version = "4.0", features = ["derive", "env"] }
lazy_static = "1.5.0"
reqwest = { version = "0.13.2", features = ["json"] }
dotenvy = "0.15.7"
walkdir = "2.5"
safetensors = "0.4"
regex = "1.10"
lru = "0.12"
rustc-hash = "1.1"
dyn-clone = "1.0"
# tch 0.25 (targets PyTorch 2.12) — not yet on crates.io, pinned to the exact
# rev that merged 2.12 support. Optional: only pulled in by the `tch-eval`
# feature so default builds stay candle-only and lean.
#
# Build requires PyTorch 2.12.x installed and these env vars:
#   LIBTORCH_USE_PYTORCH=1            (link against the pip torch, no 2GB download)
#   LIBTORCH_BYPASS_VERSION_CHECK=1   (safe: 2.12.0-vs-2.12.1 is patch-only, ABI-stable)
#   PATH must have .venv/bin first     (so torch-sys' build script finds torch)
# Runtime requires:
#   DYLD_LIBRARY_PATH=.venv/lib/python3.13/site-packages/torch/lib
tch = { git = "https://github.com/LaurentMazare/tch-rs", rev = "bbf49e6db463845a39cdab6d51f2a8f2b103b59f", optional = true }

# macOS-only bindings to Apple's MPSGraph (via MetalPerformanceShadersGraph),
# used to bypass libtorch's serial MPS dispatch queue for inference. See
# metal_network.rs. Optional: only pulled in by the `metal-eval` feature.
[target.'cfg(target_os = "macos")'.dependencies]
apple-mpsgraph = { version = "0.2.8", optional = true }
apple-metal = { version = "0.8.8", optional = true }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["candle-core/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Route self-play NN inference through libtorch/MPS (tch-rs) instead of candle
# Metal, which is ~19x slower for PolyZeroNet's shapes. See tch_network.rs.
tch-eval = ["dep:tch"]
# Route self-play NN inference through a hand-composed MPSGraph, bypassing
# libtorch's serial MPS dispatch queue entirely. See metal_network.rs.
metal-eval = ["dep:apple-mpsgraph", "dep:apple-metal"]
# Catch-all for the full macOS build: everything Metal/Apple-related at once.
# Keep the individual features above for isolating one backend during debugging.
apple = ["metal", "accelerate", "tch-eval", "metal-eval"]

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = true

